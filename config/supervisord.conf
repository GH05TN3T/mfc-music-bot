[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[program:po-token-provider]
command=/usr/local/bin/node /opt/bgutil/build/main.js --host 127.0.0.1 --port 4416
directory=/opt/bgutil
priority=10
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:lavalink]
command=/bin/sh -c 'mkdir -p "%(ENV_MUSIC_DATA_DIR)s/tmp" "%(ENV_MUSIC_DATA_DIR)s/lavalink/plugins" && exec /usr/bin/java -Xms256m -Xmx2g -Djava.io.tmpdir="%(ENV_MUSIC_DATA_DIR)s/tmp" -jar /opt/lavalink/Lavalink.jar --spring.config.location=file:/opt/music-bot/config/application.yml'
directory=/opt/lavalink
priority=20
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:youtube-resolver]
command=/usr/local/bin/node /opt/music-bot/src/resolver.js
directory=/opt/music-bot
priority=30
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:discord-music-bots]
command=/usr/local/bin/node /opt/music-bot/src/index.js
directory=/opt/music-bot
priority=40
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
